name: isar_test

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  integration_test:
    sdk: flutter
  intl: ^0.20.2
  isar:
    path: ../isar
  isar_community_flutter_libs:
    path: ../isar_community_flutter_libs
  json_annotation: ^4.7.0
  meta: ^1.8.0
  path: ^1.8.2
  path_provider: ^2.0.10
  test: ^1.21.4
  test_api: ^0.7.7
dev_dependencies:
  build_runner: any
  flutter_test:
    sdk: flutter
  isar_generator:
    path: ../isar_generator
  json_serializable: ^6.3.1
  very_good_analysis: ^3.0.1

dependency_overrides:
  # Keep the build 2 / source_gen 2 generator on analyzer 7 while using a
  # test runner whose analyzer integration predates analyzer 8.
  analyzer: 7.6.0
  dart_style: 3.1.1
  matcher: 0.12.19
  test: 1.26.3
  test_api: 0.7.11
  test_core: 0.6.12
  isar:
    path: ../isar
  isar_community_flutter_libs:
    path: ../isar_community_flutter_libs
  isar_generator:
    path: ../isar_generator
